<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Geometry Dash</title>
<link href="https://fonts.cdnfonts.com/css/pusab" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:manipulation}
body{font-family:'Pusab','Titan One','Arial Rounded MT Bold',sans-serif}
#cv{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

.gd-outline{color:#fff;--ow:3px;
 text-shadow:calc(var(--ow)*-1) calc(var(--ow)*-1) 0 #000, var(--ow) calc(var(--ow)*-1) 0 #000,
 calc(var(--ow)*-1) var(--ow) 0 #000, var(--ow) var(--ow) 0 #000,
 0 calc(var(--ow)*-1) 0 #000, 0 var(--ow) 0 #000,
 calc(var(--ow)*-1) 0 0 #000, var(--ow) 0 0 #000}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:10}
.screen>*{pointer-events:auto}
.hidden{display:none!important}

#menuScr{justify-content:flex-start}
#logoImg{width:min(74vw,640px);margin-top:6vh;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6));opacity:0;transition:opacity .5s}
#logoImg.on{opacity:1}
#logoTxt{display:none;font-size:clamp(38px,9vw,92px);letter-spacing:2px;margin-top:8vh}
#menuMid{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
#playBtn{background:none;border:none;cursor:pointer;padding:0;line-height:0}
#playImg{width:clamp(110px,16vw,175px);height:auto;display:block}
#menuHint{margin-bottom:4.5vh;font-size:15px;--ow:2px;opacity:.9;letter-spacing:1px;text-align:center;line-height:1.7}
#rotateHint{display:none;font-size:13px;--ow:2px;opacity:.85;margin-bottom:10px}
@media (orientation:portrait) and (max-width:620px){#rotateHint{display:block}}
@keyframes growBounce{0%{transform:scale(1)}55%{transform:scale(1.18)}78%{transform:scale(1.08)}100%{transform:scale(1.12)}}
@keyframes shrinkBounce{0%{transform:scale(1.12)}55%{transform:scale(.94)}80%{transform:scale(1.02)}100%{transform:scale(1)}}

#selectScr{justify-content:center}
#backBtn{position:absolute;top:18px;left:18px}
#levelRow{position:relative;width:100%;display:flex;justify-content:center}
#prevBtn{position:absolute;left:3vw;top:calc(50% - 27px)}
#nextBtn{position:absolute;right:3vw;top:calc(50% - 27px)}
#levelCard{width:min(540px,76vw);padding:28px 34px 24px;background:rgba(8,11,26,.55);border:3px solid #fff;border-radius:18px;
 box-shadow:0 8px 0 rgba(0,0,0,.35);cursor:pointer;text-align:center;
 transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .22s}
#levelCard:hover{transform:scale(1.04);background:rgba(8,11,26,.78)}
#levelCard:active{transform:scale(.98)}
@keyframes cardPop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
#cardName{font-size:clamp(30px,5.5vw,46px)}
#cardSub{margin-top:12px;font-size:17px;--ow:2px;display:flex;align-items:center;justify-content:center;gap:9px;opacity:.95}
#cardSub svg{width:17px;height:17px}
#cardPlay{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;font-size:16px;--ow:2px}
#cardPlay svg{width:15px;height:15px;fill:#fff}
#dots{display:flex;gap:10px;margin-top:28px}
#dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(0,0,0,.45)}
#dots i.on{background:#fff}

#pauseBtn{position:absolute;top:16px;left:16px}
#progWrap{margin-top:18px;display:flex;align-items:center;gap:12px}
#progBarOuter{width:min(420px,44vw);height:12px;border:2px solid rgba(255,255,255,.85);border-radius:7px;background:rgba(0,0,0,.35);overflow:hidden}
#progBar{height:100%;width:0%;background:#fff}
#progPct{font-size:15px;--ow:2px;min-width:52px}

.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,5,14,.55)}
.panel{max-width:92vw;background:rgba(9,12,28,.94);border:3px solid #fff;border-radius:20px;padding:34px 46px;text-align:center;
 box-shadow:0 10px 0 rgba(0,0,0,.45);animation:panelIn .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes panelIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.panel h1{font-size:clamp(32px,6vw,52px)}
.panel .stats{margin:16px 0 26px;font-size:17px;--ow:2px;line-height:1.9;opacity:.95}
.btnRow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.btnCol{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.gd-btn{font-family:inherit;color:#fff;font-size:21px;--ow:2px;background:rgba(20,26,52,.9);border:3px solid #fff;border-radius:13px;
 padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.5);
 transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s}
.gd-btn:hover{transform:scale(1.08)}
.gd-btn:active{transform:scale(.95);box-shadow:0 2px 0 rgba(0,0,0,.5)}

.iconbtn{width:54px;height:54px;border-radius:50%;background:rgba(8,11,26,.55);border:3px solid rgba(255,255,255,.9);
 display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);
 transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s}
.iconbtn:hover{transform:scale(1.12);background:rgba(8,11,26,.8)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:22px;height:22px;fill:#fff}
#muteBtn{position:fixed;top:16px;right:16px;z-index:40}
@media (max-width:560px){.iconbtn{width:44px;height:44px}.panel{padding:26px 26px}}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:30}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="menuScr" class="screen">
  <img id="logoImg" draggable="false" referrerpolicy="no-referrer" alt="Geometry Dash"
       src="https://cdn2.steamgriddb.com/logo_thumb/6547489ef6174ae02b6d87ee775b3950.png">
  <div id="logoTxt" class="gd-outline">GEOMETRY DASH</div>
  <div id="menuMid">
    <button id="playBtn" aria-label="Play">
      <!-- built-in button baked into the HTML: always visible even before JS runs -->
      <img id="playImg" draggable="false" referrerpolicy="no-referrer" width="120" height="120" alt="Play"
           src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2254%22%20fill%3D%22%2339b54a%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%228%22%2F%3E%3Cpath%20d%3D%22M46%2036%20L88%2060%20L46%2084%20Z%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E">
    </button>
  </div>
  <div id="rotateHint" class="gd-outline">tip: landscape gives more reaction time</div>
  <div id="menuHint" class="gd-outline">press play to pick a level<br>click, tap or press space to jump</div>
</div>

<div id="selectScr" class="screen hidden">
  <button id="backBtn" class="iconbtn" aria-label="Back to menu">
    <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8 2-2-6-6 6-6z"/></svg>
  </button>
  <div id="levelRow">
    <button id="prevBtn" class="iconbtn" aria-label="Previous level">
      <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8 2-2-6-6 6-6z"/></svg>
    </button>
    <div id="levelCard" role="button" tabindex="0">
      <div id="cardName" class="gd-outline">Stereo Madness</div>
      <div id="cardSub" class="gd-outline">
        <svg viewBox="0 0 24 24"><path fill="#ffd936" stroke="#000" stroke-width="1.2"
          d="M12 2.5l2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 16.8l-5.6 3 1.2-6.3L3 9.1l6.3-.8z"/></svg>
        <span id="cardSubTxt"></span>
      </div>
      <div id="cardPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>PLAY</span></div>
    </div>
    <button id="nextBtn" class="iconbtn" aria-label="Next level">
      <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8-2-2 6-6-6-6z"/></svg>
    </button>
  </div>
  <div id="dots"></div>
</div>

<div id="hud" class="screen hidden">
  <button id="pauseBtn" class="iconbtn" aria-label="Pause">
    <svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
  </button>
  <div id="progWrap">
    <div id="progBarOuter"><div id="progBar"></div></div>
    <div id="progPct" class="gd-outline">0%</div>
  </div>
</div>

<div id="pauseScr" class="overlay hidden"><div class="panel">
  <h1 class="gd-outline">Paused</h1>
  <div class="btnCol">
    <button id="resumeBtn" class="gd-btn gd-outline">Resume</button>
    <button id="restartBtn" class="gd-btn gd-outline">Restart</button>
    <button id="exitBtn" class="gd-btn gd-outline">Exit</button>
  </div>
</div></div>

<div id="completeScr" class="overlay hidden"><div class="panel">
  <h1 class="gd-outline">Level Complete!</h1>
  <div class="stats gd-outline" id="completeStats"></div>
  <div class="btnRow">
    <button id="replayBtn" class="gd-btn gd-outline">Replay</button>
    <button id="levelsBtn" class="gd-btn gd-outline">Level Select</button>
  </div>
</div></div>

<button id="muteBtn" class="iconbtn" aria-label="Toggle sound"></button>
<div id="fade"></div>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const SPEED = 10.4;                      // blocks / second (ground + world scroll)
const BG_SPEED = 0.5;                    // blocks / second (background parallax)
const GRAV = 65.45;                      // blocks / s^2  (1 block = 1 m)
const JUMP_H = 2.15;                     // peak jump height in blocks
const VJ = Math.sqrt(2 * GRAV * JUMP_H);         // launch velocity
const AIRTIME = 2 * VJ / GRAV;                   // full jump duration
const ROT_SPEED = Math.PI / AIRTIME;             // 180° per jump — two rotations, double speed
const VIEW = 12, GROUNDB = 4;            // view height / ground depth (one full 4x4 texture tile)
const BG_H = 13;                         // background tile height (blocks)

const C1 = [255, 222, 0];                // yellow  — the cube's light gray parts (color 1)
const C2 = [64, 229, 255];               // light blue — the cube's white parts (color 2)

const GROUND_URL = 'https://www.spriters-resource.com/media/asset_icons/133/136043.png';
const BG_URL = 'https://www.tiermaker.com/images/chart/chart/geometry-dash-backgrounds-796573/gamebg01001png.png';
const CUBE_URL = 'https://gdbrowser.com/iconkit/premade/cube_25.png';
const BLOCK_URL = 'https://static.wikia.nocookie.net/geometry-dash/images/0/01/RegularBlock01.png/revision/latest?cb=20160604070948';
const SPIKE_URL = 'https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/1a711018-ef54-44de-a242-bbda94dfb631/dfixr6b-d1483b50-07a2-48dd-9b52-a9796f626b49.png/v1/fill/w_122,h_122/geometry_dash_spike_by_pastilias2011_dfixr6b-fullview.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTIyIiwicGF0aCI6Ii9mLzFhNzExMDE4LWVmNTQtNDRkZS1hMjQyLWJiZGE5NGRmYjYzMS9kZml4cjZiLWQxNDgzYjUwLTA3YTItNDhkZC05YjUyLWE5Nzk2ZjYyNmI0OS5wbmciLCJ3aWR0aCI6Ijw9MTIyIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmltYWdlLm9wZXJhdGlvbnMiXX0.s35Z93S0yepHdE3Xq_SB3uXkxkThOvpnLBarUUslWrg';
const SONG_URL = 'https://us-tuna-sounds-files.voicemod.net/53eb4a34-e94c-449e-8c15-9c52b09361bb-1701906913972.mp3';
const DEATH_URL = 'https://us-tuna-sounds-files.voicemod.net/7996693a-f1e0-495b-8b59-2d3e9e098dc6-1707161393349.mp3';

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
function loadImg(url, cors) {
  return new Promise((res, rej) => {
    const im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    im.referrerPolicy = 'no-referrer';
    im.onload = () => { im.naturalWidth > 1 ? res(im) : rej(new Error('empty image')); };
    im.onerror = () => rej(new Error('failed: ' + url));
    im.src = url;
  });
}
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbStr = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const fmtTime = s => { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); };

/* ================= canvas size ================= */
let W = 1, H = 1, BLOCK = 1, groundY = 0;
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  BLOCK = H / VIEW; groundY = H - GROUNDB * BLOCK;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.ResizeObserver) { try { new ResizeObserver(() => resize()).observe(document.documentElement); } catch (e) {} }
resize();

/* ================= assets ================= */
function proceduralGround() {
  const c = mk(256, 256), x = c.getContext('2d');
  x.fillStyle = '#f2f5fa'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = 'rgba(0,0,0,.16)'; x.lineWidth = 3; x.strokeRect(1.5, 1.5, 253, 253);
  x.strokeStyle = 'rgba(0,0,0,.07)';
  for (let i = 1; i < 4; i++) { x.beginPath(); x.moveTo(i * 64, 0); x.lineTo(i * 64, 256); x.moveTo(0, i * 64); x.lineTo(256, i * 64); x.stroke(); }
  x.fillStyle = 'rgba(0,0,0,.05)';
  x.fillRect(32, 32, 48, 48); x.fillRect(160, 32, 48, 48); x.fillRect(32, 160, 48, 48); x.fillRect(160, 160, 48, 48);
  return c;
}
function proceduralBg() {
  const c = mk(768, 768), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 768);
  g.addColorStop(0, '#f0f3f8'); g.addColorStop(1, '#878da0');
  x.fillStyle = g; x.fillRect(0, 0, 768, 768);
  x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 3;
  for (const [bx, by, s] of [[60, 180, 130], [300, 90, 90], [420, 300, 170], [150, 420, 110], [560, 460, 140]]) x.strokeRect(bx, by, s, s);
  return c;
}
function proceduralCube() {
  const c = mk(256, 256), x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, 256, 256);
  x.fillStyle = `rgb(${C1})`; x.fillRect(14, 14, 228, 228);
  x.fillStyle = `rgb(${C2})`; x.fillRect(58, 58, 140, 140);
  x.fillStyle = '#000';
  x.fillRect(84, 92, 26, 30); x.fillRect(146, 92, 26, 30); x.fillRect(84, 152, 88, 20);
  return c;
}
function squareCrop(im, size) {
  const s = Math.min(im.naturalWidth, im.naturalHeight);
  if (s < 2) return proceduralGround();
  const c = mk(size, size), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, size, size);
  return c;
}
function makeBgTile(im) {
  const h = 768, w = Math.max(64, Math.round(h * im.naturalWidth / im.naturalHeight));
  const c = mk(w, h), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(im, 0, 0, w, h);
  return c;
}

/* ---- cube recolor: light gray -> yellow (color 1), white -> light blue (color 2) ---- */
function colorizeCube(im) {
  const w = im.naturalWidth, h = im.naturalHeight;
  if (w < 2 || h < 2) return proceduralCube();
  const c = mk(w, h), x = c.getContext('2d');
  try { x.drawImage(im, 0, 0); } catch (e) { return proceduralCube(); }
  let id;
  try { id = x.getImageData(0, 0, w, h); } catch (e) { return c; }
  const d = id.data;
  const hist = new Uint32Array(256);
  let opaque = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200) { hist[((d[i] + d[i + 1] + d[i + 2]) / 3) | 0]++; opaque++; }
  const peak = (lo, hi) => { let m = 0, mi = lo; for (let j = lo; j <= hi; j++) if (hist[j] > m) { m = hist[j]; mi = j; } return mi; };
  const Bp = peak(0, 90), Gp = peak(120, 234), Wp = Math.max(peak(235, 255), 235);
  let t1 = 95, t2 = 244;
  if (opaque > 0 && hist[Gp] > opaque * 0.02) {
    t2 = Math.min(250, Math.max(198, (Gp + Wp) / 2));
    t1 = Math.max(45, Math.min(95, (Bp + Gp) / 2));
  }
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 8) continue;
    const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
    if (lum >= t2) { d[i] = C2[0]; d[i + 1] = C2[1]; d[i + 2] = C2[2]; }
    else if (lum >= t2 - 12 && lum > t1) {
      const k = (lum - (t2 - 12)) / 12;
      d[i] = C1[0] + (C2[0] - C1[0]) * k; d[i + 1] = C1[1] + (C2[1] - C1[1]) * k; d[i + 2] = C1[2] + (C2[2] - C1[2]) * k;
    }
    else if (lum >= t1) { d[i] = C1[0]; d[i + 1] = C1[1]; d[i + 2] = C1[2]; }
  }
  x.putImageData(id, 0, 0);
  return c;
}
async function loadCube() {
  for (const cors of [true, false]) {
    try { return colorizeCube(await loadImg(CUBE_URL, cors)); } catch (e) {}
  }
  return proceduralCube();
}

/* ---- cube shatter pieces (the icon divides into these on death) ---- */
let cubeImg = proceduralCube();
let cubePieces = [];
function setCube(c) {
  cubeImg = c;
  cubePieces = [];
  const N = 4, pw = Math.max(1, Math.floor(c.width / N)), ph = Math.max(1, Math.floor(c.height / N));
  for (let r = 0; r < N; r++) for (let col = 0; col < N; col++) {
    const pc = mk(pw, ph), px = pc.getContext('2d');
    px.drawImage(c, col * pw, r * ph, pw, ph, 0, 0, pw, ph);
    cubePieces.push(pc);
  }
}
setCube(cubeImg);
loadCube().then(c => setCube(c));

/* ---- obstacle sprites: block (object ID 1) and spike (object ID 8) ---- */
/* Outline + glow are painted purely with compositing (silhouette minus a shrunken
   copy = edge band), so they work even when the texture host blocks pixel reads. */
const SPRITE_T = 256, SPRITE_M = 48;
function toTile(img) {
  const c = mk(SPRITE_T, SPRITE_T), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, 0, SPRITE_T, SPRITE_T);
  return c;
}
function edgeBand(src, shrink) {   // white band following the silhouette edge
  const T = SPRITE_T, b = mk(T, T), bx = b.getContext('2d');
  const inset = (1 - shrink) / 2;
  bx.drawImage(src, 0, 0);
  bx.globalCompositeOperation = 'destination-out';
  bx.drawImage(src, T * inset, T * inset, T * shrink, T * shrink);
  bx.globalCompositeOperation = 'source-in';
  bx.fillStyle = '#fff'; bx.fillRect(0, 0, T, T);
  bx.globalCompositeOperation = 'source-over';
  return b;
}
function buildSprite(tile) {
  const T = SPRITE_T, M = SPRITE_M;
  // working tile: white outline band stamped over the original black one
  const w = mk(T, T), wx = w.getContext('2d');
  wx.drawImage(tile, 0, 0);
  wx.drawImage(edgeBand(w, 0.80), 0, 0);
  // wider, softer band for the inner half of the glow
  const gb = edgeBand(w, 0.70);
  // sprite = tile + margin, with a white glow around the outline (inside and out)
  const Ssz = T + 2 * M;
  const spr = mk(Ssz, Ssz), sx = spr.getContext('2d');
  sx.globalCompositeOperation = 'lighter';
  for (let a = 0; a < 12; a++) {
    sx.globalAlpha = 0.06;
    sx.drawImage(w, M + Math.cos(a * Math.PI / 6) * 10, M + Math.sin(a * Math.PI / 6) * 10);
    sx.globalAlpha = 0.035;

/* ================= multiply tinting (white parts -> color, black stays black) ================= */
const MULTIPLY_OK = (() => {
  const c = mk(2, 2), x = c.getContext('2d');
  x.fillStyle = '#808080'; x.fillRect(0, 0, 2, 2);
  x.globalCompositeOperation = 'multiply'; x.fillStyle = '#808080'; x.fillRect(0, 0, 2, 2);
  const d = x.getImageData(0, 0, 1, 1).data;
  return d[0] < 110;
})();
const scratch = new Map();
function tinted(src, color) {
  let sc = scratch.get(src);
  if (!sc) { sc = { c: mk(src.width, src.height), x: null }; sc.x = sc.c.getContext('2d'); scratch.set(src, sc); }
  const { c, x } = sc;
  x.globalCompositeOperation = 'source-over';
  x.clearRect(0, 0, c.width, c.height);
  x.drawImage(src, 0, 0);
  if (MULTIPLY_OK) {
    x.globalCompositeOperation = 'multiply';
    x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  } else {
    x.globalCompositeOperation = 'source-atop';
    x.globalAlpha = 0.6; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); x.globalAlpha = 1;
  }
  x.globalCompositeOperation = 'destination-in';
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-over';
  return c;
}

  for (const p of S.confetti) {
    ctx.save();
    ctx.translate(p.x * BLOCK, p.y * BLOCK); ctx.rotate(p.r);
    ctx.fillStyle = p.col;
    const s = p.s * BLOCK; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
}
function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (S.screen === 'menu') {
    const col = `hsl(${S.hue.toFixed(1)},88%,58%)`;
    drawBg(S.menuBg, col);
    drawGround(S.menuGround, col);
  } else if (S.screen === 'select') {
    ctx.fillStyle = rgbStr(S.selColor); ctx.fillRect(0, 0, W, H);
    drawGround(0, rgbStr(S.selColor));   // static ground
    let g = ctx.createLinearGradient(0, H * 0.38, 0, groundY);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
    g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = g; ctx.fillRect(0, groundY, W, H - groundY);
  } else if (S.screen === 'game') {
    const col = S.level.color;
    drawBg(S.bgOff, col);
    drawGround(S.cam, col);
    drawObjects();
    drawAttemptText();
    if (S.sub !== 'dead') drawPlayer();
    drawParticles();
    drawConfetti();
  }
}

/* ================= particles ================= */
function dust(off, vy) {
  return { x: P.x + off, y: 0.05, vx: -1.5 - Math.random() * 1.5, vy: vy + Math.random() * 1.2,
    s: 0.05 + Math.random() * 0.06, r: Math.random() * Math.PI, vr: (Math.random() - .5) * 6,
    col: 'rgba(255,255,255,', life: 0.3 + Math.random() * 0.25, t: 0 };
}
function landDust() { for (let i = 0; i < 5; i++) S.particles.push(dust((Math.random() - .5) * 0.9, 0.6)); }
function spawnDeathFx() {          // the icon divides into small square parts that bounce around
  const N = 4;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const img = cubePieces[r * N + c];
    if (!img) continue;
    S.particles.push({
      x: P.x + (c + 0.5) / N, y: P.y + 1 - (r + 0.5) / N,
      vx: ((c + 0.5) / N - 0.5) * 6 + (Math.random() - 0.5) * 3,
      vy: 3.5 + Math.random() * 5.5 + (N - 1 - r) * 0.9,
      s: 1 / N, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 14,
      img, life: 1.4, t: 0
    });
  }
  S.rings.push({ x: P.x, y: P.y + 0.5, t: 0 });
}
function updateParticles(dt) {
  for (const p of S.particles) {
    p.t += dt; p.vy -= 28 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    if (p.y < 0.06 && p.vy < 0) { p.y = 0.06; p.vy *= -0.45; p.vx *= 0.85; }
  }
  S.particles = S.particles.filter(p => p.t < p.life);
  for (const r of S.rings) r.t += dt;
  S.rings = S.rings.filter(r => r.t < 0.4);
}
function spawnConfetti() {
  const cols = ['rgb(255,222,0)', 'rgb(64,229,255)', 'rgb(255,255,255)', S.level.color];
  for (let i = 0; i < 70; i++) {
    S.confetti.push({ x: Math.random() * (W / BLOCK), y: -1 - Math.random() * 3,
      vy: 2.2 + Math.random() * 3.4, vx: (Math.random() - .5) * 1.6,
      s: 0.09 + Math.random() * 0.14, r: Math.random() * Math.PI, vr: (Math.random() - .5) * 8,
      col: cols[i % 4], t: 0, sway: Math.random() * Math.PI * 2 });
  }
}
function updateConfetti(dt) {
  for (const p of S.confetti) {
    p.t += dt; p.y += p.vy * dt;
    p.x += (p.vx + Math.sin(p.t * 2.4 + p.sway) * 0.5) * dt; p.r += p.vr * dt;
  }
  S.confetti = S.confetti.filter(p => p.y < VIEW + 1);
}

/* ================= physics ================= */
function jump() {
  P.vy = VJ; P.grounded = false; S.jumps++;
  AC.jump();
  S.particles.push(dust(-0.05, 1.2), dust(0.55, 1.2));
}
function die() {
  S.sub = 'dead'; S.deadT = 0;
  playDeathSound();          // plays once
  AC.setMode(null);
  spawnDeathFx();
}
function respawn() {          // respawn timing unchanged
  S.attempts++; S.sub = 'playing';
  S.playerX = calcPlayerX();
  P.x = S.playerX; P.y = 0; P.vy = 0; P.rot = 0; P.grounded = true;
  S.cam = 0; S.bgOff = 0; objIdx = 0; dustAcc = 0;
  S.particles.length = 0; S.rings.length = 0;
  AC.setMode('level');
}
function win() {
  S.sub = 'complete'; S.winT = 0;
  AC.setMode(null); AC.win();
  spawnConfetti();
}
function step(st) {
  const prevY = P.y, wasG = P.grounded;
  if (input.held && P.grounded) jump();
  P.vy -= GRAV * st;
  P.y += P.vy * st;
  P.x += SPEED * st;
  P.grounded = false;
  if (P.y <= 0) { P.y = 0; if (P.vy < 0) P.vy = 0; P.grounded = true; }

  const objs = S.objects;
  for (let i = objIdx; i < objs.length; i++) {
    const o = objs[i];
    if (o.x > P.x + 1.3) break;
    if (o.x + 1.3 < P.x) { objIdx = i + 1; continue; }
    if (o.k === 1) { // block (object ID 1): land on top, anything else kills
      if (P.x + 1 > o.x + 0.02 && P.x < o.x + 0.98 && P.y < o.y + 1 && P.y + 1 > o.y) {
        if (P.vy <= 0 && prevY >= o.y + 1 - 0.22) { P.y = o.y + 1; P.vy = 0; P.grounded = true; }
        else { die(); return; }
      }
    } else { // spike (object ID 8): small triangle hitbox
      if (P.x + 1 > o.x + 0.30 && P.x < o.x + 0.70 && P.y < o.y + 0.70 && P.y + 1 > o.y + 0.15) { die(); return; }
    }
  }
  if (!P.grounded) P.rot += ROT_SPEED * st;                       // 180° per jump, double speed
  else if (!wasG) { P.rot = Math.ceil(P.rot / (Math.PI / 2)) * (Math.PI / 2); landDust(); }

  if (S.sub === 'playing' && P.x > S.level.len + 4) { win(); return; }
  if (S.sub === 'intro' && P.x >= S.playerX) { P.x = S.playerX; S.sub = 'playing'; }
}

/* ================= main loop ================= */
const progBar = $('progBar'), progPct = $('progPct');
function update(dt) {
  if (S.screen === 'menu') {
    S.menuGround += SPEED * dt;      // ground scrolls left at 10.4 blocks/s
    S.menuBg += BG_SPEED * dt;       // background at 0.5 blocks/s
    S.hue = (S.hue + 14 * dt) % 360; // slow rainbow cycle
  } else if (S.screen === 'select') {
    const t = hexRgb(LEVELS[S.selIdx].color), k = 1 - Math.exp(-7 * dt);
    for (let i = 0; i < 3; i++) S.selColor[i] += (t[i] - S.selColor[i]) * k;
  } else if (S.screen === 'game' && !S.paused) {
    if (S.sub === 'intro' || S.sub === 'playing') {
      let acc = dt;
      while (acc > 1e-6 && (S.sub === 'intro' || S.sub === 'playing')) {
        const st = Math.min(1 / 240, acc); acc -= st; step(st);
      }
      if (S.sub === 'playing') { S.cam = P.x - S.playerX; S.bgOff += BG_SPEED * dt; }
      if (P.grounded && S.sub === 'playing') {
        dustAcc += dt;
        while (dustAcc > 0.07) { dustAcc -= 0.07; S.particles.push(dust(-0.05, 0.4)); }
      } else dustAcc = 0;
    } else if (S.sub === 'dead') {
      S.deadT += dt; if (S.deadT >= 0.9) respawn();   // respawn time unchanged
    } else if (S.sub === 'complete') {
      S.winT += dt;
      if (S.winT > 0.7 && $('completeScr').classList.contains('hidden')) {
        $('completeStats').innerHTML =
          `Attempts: ${S.attempts}<br>Jumps: ${S.jumps}<br>Time: ${fmtTime((performance.now() - S.startTime) / 1000)}`;
        $('completeScr').classList.remove('hidden');
      }
      if (lastPct !== 100) { lastPct = 100; progBar.style.width = '100%'; progPct.textContent = '100%'; }
    }
    updateParticles(dt); updateConfetti(dt);
    const total = S.level.len + 4;
    const pct = Math.max(0, Math.min(99, Math.round((P.x - S.playerX) / (total - S.playerX) * 100)));
    if (pct !== lastPct) { lastPct = pct; progBar.style.width = pct + '%'; progPct.textContent = pct + '%'; }
  }
}
let lastT = performance.now(), loggedErr = false;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (S.screen === 'game' && S.paused) return;
  try { update(dt); render(); }
  catch (e) { if (!loggedErr) { loggedErr = true; console.error(e); } }
}

/* ================= screens & UI ================= */
const menuScr = $('menuScr'), selectScr = $('selectScr'), hud = $('hud'),
      pauseScr = $('pauseScr'), completeScr = $('completeScr'), fadeEl = $('fade');

function setScreen(name) {
  S.screen = name; S.paused = false;
  menuScr.classList.toggle('hidden', name !== 'menu');
  selectScr.classList.toggle('hidden', name !== 'select');
  hud.classList.toggle('hidden', name !== 'game');
  pauseScr.classList.add('hidden');
  completeScr.classList.add('hidden');
  if (name === 'select') updateCard();
  if (name === 'menu' || name === 'select') {
    if (songOk === false) { if (AC.mode !== 'menu') AC.setMode('menu'); }   // synth fallback
    else { if (AC.mode) AC.setMode(null); tryPlayMenu(); }
  } else {
    menuSong.pause();
    if (AC.mode) AC.setMode(null);
  }
}
let fading = false;
function goto(fn) {
  if (fading) return; fading = true;
  fadeEl.style.opacity = '1';
  setTimeout(() => {
    fn();
    requestAnimationFrame(() => {
      fadeEl.style.opacity = '0';
      setTimeout(() => { fading = false; }, 240);
    });
  }, 230);
}
function startLevel(i) {
  const L = LEVELS[i];
  S.level = L; S.objects = L.make();
  setScreen('game');
  S.sub = 'intro'; S.cam = 0; S.bgOff = 0; objIdx = 0; dustAcc = 0;
  S.playerX = calcPlayerX();
  S.attempts = 1; S.jumps = 0; S.startTime = performance.now();
  P.x = -2.2; P.y = 0; P.vy = 0; P.rot = 0; P.grounded = true;
  S.particles.length = 0; S.rings.length = 0; S.confetti = [];
  lastPct = -1;
  AC.setMode('level');
}
function updateCard() {
  const L = LEVELS[S.selIdx];
  $('cardName').textContent = L.name;
  $('cardSubTxt').textContent = `${L.stars} · ${L.diff} · ${Math.round((L.len + 4) / SPEED)}s`;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === S.selIdx));
}
function switchLevel(dir) {
  S.selIdx = (S.selIdx + dir + LEVELS.length) % LEVELS.length;
  updateCard();
  const card = $('levelCard');
  card.style.animation = 'none'; void card.offsetWidth;
  card.style.animation = 'cardPop .32s cubic-bezier(.34,1.56,.64,1)';
}
function pauseGame() {
  if (S.screen !== 'game' || S.paused) return;
  if (S.sub !== 'playing' && S.sub !== 'intro') return;
  S.paused = true; input.held = false;
  pauseScr.classList.remove('hidden');
  if (AC.ctx) AC.ctx.suspend();
}
function resumeGame() {
  S.paused = false; pauseScr.classList.add('hidden');
  if (AC.ctx) AC.ctx.resume();
}

/* ---- play button: the built-in image is in the HTML; play.png swaps in when it loads ---- */
const playImg = $('playImg');
const tryPlay = new Image();
tryPlay.referrerPolicy = 'no-referrer';
tryPlay.onload = () => { playImg.src = 'play.png'; };
tryPlay.src = 'play.png';

/* ---- logo: image with a hard text fallback ---- */
const logoImg = $('logoImg'), logoTxt = $('logoTxt');
let logoDone = false;
const logoFallback = () => { if (logoDone) return; logoDone = true; logoImg.style.display = 'none'; logoTxt.style.display = 'block'; };
logoImg.addEventListener('load', () => { logoDone = true; logoImg.classList.add('on'); });
logoImg.addEventListener('error', logoFallback);
setTimeout(() => { if (!(logoImg.complete && logoImg.naturalWidth > 0)) logoFallback(); }, 5000);

/* play button hover: grow with a bounce, shrink back with a bounce */
const playBtn = $('playBtn');
playBtn.addEventListener('mouseenter', () => {
  playBtn.style.animation = 'none'; void playBtn.offsetWidth;
  playBtn.style.animation = 'growBounce .34s ease forwards';
});
playBtn.addEventListener('mouseleave', () => {
  playBtn.style.animation = 'none'; void playBtn.offsetWidth;
  playBtn.style.animation = 'shrinkBounce .34s ease forwards';
});

/* ---- navigation: menu -> level select -> level, no shortcuts ---- */
playBtn.addEventListener('click', () => { AC.ensure(); goto(() => setScreen('select')); });
 $('backBtn').addEventListener('click', () => goto(() => setScreen('menu')));
 $('prevBtn').addEventListener('click', () => switchLevel(-1));
 $('nextBtn').addEventListener('click', () => switchLevel(1));
 $('levelCard').addEventListener('click', () => goto(() => startLevel(S.selIdx)));
 $('levelCard').addEventListener('keydown', e => {
  if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopPropagation(); goto(() => startLevel(S.selIdx)); }
});
 $('pauseBtn').addEventListener('click', pauseGame);
 $('resumeBtn').addEventListener('click', resumeGame);
 $('restartBtn').addEventListener('click', () => goto(() => { if (AC.ctx) AC.ctx.resume(); startLevel(S.selIdx); }));
 $('exitBtn').addEventListener('click', () => goto(() => { if (AC.ctx) AC.ctx.resume(); setScreen('select'); }));
 $('replayBtn').addEventListener('click', () => goto(() => startLevel(S.selIdx)));
 $('levelsBtn').addEventListener('click', () => goto(() => setScreen('select')));

/* mute */
const SOUND_SVG = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16 8.2a5 5 0 0 1 0 7.6l-1.3-1.5a3 3 0 0 0 0-4.6L16 8.2z"/><path d="M18.6 5.5a8.5 8.5 0 0 1 0 13l-1.3-1.5a6.5 6.5 0 0 0 0-10L18.6 5.5z"/></svg>';
const MUTE_SVG = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16.2 9.7 21.5 15M21.5 9.7 16.2 15" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
const muteBtn = $('muteBtn');
function updateMuteIcon() { muteBtn.innerHTML = AC.muted ? MUTE_SVG : SOUND_SVG; }
muteBtn.addEventListener('click', () => { AC.ensure(); applyMute(!AC.muted); updateMuteIcon(); });
updateMuteIcon();

/* ================= input ================= */
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); AC.ensure(); tryPlayMenu(); input.held = true; }
  else if (e.code === 'Enter' && S.screen === 'menu' && !fading) { AC.ensure(); tryPlayMenu(); goto(() => setScreen('select')); }
  else if (e.code === 'Escape' || e.code === 'KeyP') {
    if (S.screen === 'game') { S.paused ? resumeGame() : pauseGame(); }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') input.held = false;
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); AC.ensure(); tryPlayMenu(); input.held = true; });
window.addEventListener('pointerdown', () => { AC.ensure(); tryPlayMenu(); });   // audio unlock on any tap
window.addEventListener('pointerup', () => { input.held = false; });
window.addEventListener('pointercancel', () => { input.held = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => {
  input.held = false;
  if (S.screen === 'game' && !S.paused && (S.sub === 'playing' || S.sub === 'intro')) pauseGame();
});

/* ================= boot ================= */
const dots = $('dots');
LEVELS.forEach(() => { const i = document.createElement('i'); dots.appendChild(i); });
updateCard();
setScreen('menu');
if (document.fonts) { document.fonts.load('20px Pusab').catch(() => {}); document.fonts.load("20px 'Titan One'").catch(() => {}); }
requestAnimationFrame(frame);

})();
</script>
</body>
